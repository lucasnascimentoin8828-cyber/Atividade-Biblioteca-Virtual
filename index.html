<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>Biblioteca Virtual</h1>

        <nav>
            <a href="#catalogo">Catálogo</a>
            <a href="#sugestoes">Sugerir Livro</a>
        </nav>
    </header>

    <main>

        <section id="catalogo">
            <h2>Catálogo de Livros</h2>

            <label for="pesquisa">Pesquisar livro:</label>
            <input type="search" id="pesquisa" placeholder="Digite o título...">

            <div class="livros">

                <article class="livro">
                    <h3>Dom Casmurro</h3>
                </article>

                <article class="livro">
                    <h3>O Pequeno Príncipe</h3>
                </article>

                <article class="livro">
                    <h3>1984</h3>
                </article>

                <article class="livro">
                    <h3>Harry Potter</h3>
                </article>

                <article class="livro">
                    <h3>O Hobbit</h3>
                </article>

                <article class="livro">
                    <h3>Senhor dos Anéis</h3>
                </article>

            </div>
        </section>

        <section id="sugestoes">
            <h2>Sugerir Novo Livro</h2>

            <form id="formulario" action="#" method="post">

                <label for="nome">Nome do leitor:</label>
                <input type="text" id="nome" required>

                <label for="titulo">Título do livro:</label>
                <input type="text" id="titulo" required>

                <button type="submit">Enviar Sugestão</button>

                <p id="mensagem"></p>

            </form>
        </section>

    </main>

    <footer>
        <p>Biblioteca Virtual - Projeto Acadêmico</p>
    </footer>

</body>
</html>
